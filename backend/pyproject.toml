[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weighguard-backend"
version = "0.1.0"
description = "WeighGuard Legal Metrology Digital Verification & Ed25519 Signing Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pynacl>=1.5.0",
    "cbor2>=5.6.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "python-dateutil>=2.9.0"
]
